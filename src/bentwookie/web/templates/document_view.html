{% extends "base.html" %}
{% block title_suffix %} - {{ doc.docname }}{% endblock %}

{% block content %}
<div class="page-header">
    <h1>{{ doc.docname }}</h1>
</div>

{% if error %}
<div class="alert alert-error">{{ error }}</div>
{% else %}
<div class="detail-card" style="padding: 1.5rem;">
    {{ content | markdown }}
</div>
{% endif %}
{% endblock %}
