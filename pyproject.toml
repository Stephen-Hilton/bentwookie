[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bentwookie"
version = "0.3.0"
description = "AI agent swarm orchestrator — auto-coding with Claude Code in Docker containers"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
]

[project.scripts]
bw = "bw.lib.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["bw*"]
